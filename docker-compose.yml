version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: mp4-to-mp3-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: mp4-to-mp3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mp4-to-mp3-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_URL=http://localhost:3000
      - MONGODB_URI=mongodb://mongo:27017/mp4tomp3
      - REDIS_URL=redis://redis:6379
      - STORAGE_DRIVER=local
      - STORAGE_LOCAL_PATH=/data/storage
      - SESSION_SECRET=${SESSION_SECRET:-production-secret-must-be-changed-in-env-32chars}
    volumes:
      - app-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mp4-to-mp3-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/mp4tomp3
      - REDIS_URL=redis://redis:6379
      - STORAGE_DRIVER=local
      - STORAGE_LOCAL_PATH=/data/storage
      - WORKER_CONCURRENCY=2
      - FFMPEG_THREADS=2
    volumes:
      - app-storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongo-data:
  redis-data:
  app-storage:

networks:
  app-network:
    driver: bridge
